<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarketHub — Shop Electronics, Fashion, Phones & More in Nigeria</title>
    <meta
      name="description"
      content="MarketHub is Nigeria's everyday online marketplace — 200+ products across electronics, phones, computers, fashion, beauty, home, groceries, sports and baby. Pay by bank transfer, verified by our team."

    <meta name="theme-color" content="#4f46e5" />
    <meta name="application-name" content="MarketHub" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#4f46e5" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MarketHub" />
    <meta property="og:title" content="MarketHub — Nigeria's everyday online marketplace" />
    <meta
      property="og:description"
      content="200+ products across 10 categories. NGN pricing, bank-transfer checkout, verified by our team."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

    />
