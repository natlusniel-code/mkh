# MarketHub — CI
#
# Verifies the app builds and its tests/typecheck pass on every push, so the
# repository is always in a deployable state. Deployment itself is done by
# Vercel (see vercel.json) or by the Teamily Publish button.
stages:
  - verify

default:
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

verify:
  stage: verify
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.15.1 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm typecheck
    - pnpm test
    - pnpm build
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
